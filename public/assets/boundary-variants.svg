<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 540" width="960" height="540"><title id="title">Same string, different boundary</title><desc id="desc">Two ideal strings have the same length and wave speed. Fixed-fixed boundaries admit a 50 hertz fundamental; fixed-free boundaries admit a 25 hertz fundamental and odd harmonics.</desc><style>
    .bg{fill:#0e1017}.panel{fill:#171b26;stroke:#465168;stroke-width:1.5}.ink{fill:#f4efe3}.muted{fill:#a8b0c1}.cyan{stroke:#74d7dd;fill:none}.gold{stroke:#e6b85c;fill:none}.rose{stroke:#e68aa3;fill:none}.green{stroke:#8bd3a8;fill:none}.line{stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.5}.node{fill:#171b26;stroke:#74d7dd;stroke-width:3}.on{fill:#e6b85c;stroke:#f4efe3;stroke-width:1}.off{fill:#272d3c;stroke:#667089;stroke-width:1}.label{font:600 18px ui-monospace,SFMono-Regular,Consolas,monospace}.small{font:14px ui-monospace,SFMono-Regular,Consolas,monospace}.title{font:700 26px ui-serif,Georgia,serif}.eq{font:17px ui-monospace,SFMono-Regular,Consolas,monospace}</style><rect class="bg" width="960" height="540"/>
    <text class="title ink" x="50" y="54">Boundary conditions select the family</text>
    <rect class="panel" x="48" y="92" width="864" height="175" rx="16"/><text class="label ink" x="74" y="128">fixed—fixed</text><polyline class="cyan line" points="90,170 102,164.61 114,159.27 126,154.03 138,148.95 150,144.07 162,139.44 174,135.11 186,131.11 198,127.48 210,124.27 222,121.49 234,119.19 246,117.37 258,116.06 270,115.26 282,115 294,115.26 306,116.06 318,117.37 330,119.19 342,121.49 354,124.27 366,127.48 378,131.11 390,135.11 402,139.44 414,144.07 426,148.95 438,154.03 450,159.27 462,164.61 474,170"/><line class="rose line" x1="88" y1="112" x2="88" y2="228"/><line class="rose line" x1="476" y1="112" x2="476" y2="228"/><text class="eq ink" x="560" y="166">fₙ = nc/(2L)</text><text class="small muted" x="560" y="198">50, 100, 150, 200 Hz</text>
    <rect class="panel" x="48" y="307" width="864" height="175" rx="16"/><text class="label ink" x="74" y="343">fixed—free</text><polyline class="gold line" points="90,390 102,387.3 114,384.61 126,381.93 138,379.27 150,376.64 162,374.03 174,371.47 186,368.95 198,366.48 210,364.07 222,361.72 234,359.44 246,357.24 258,355.11 270,353.06 282,351.11 294,349.25 306,347.48 318,345.82 330,344.27 342,342.82 354,341.49 366,340.28 378,339.19 390,338.22 402,337.37 414,336.65 426,336.06 438,335.6 450,335.26 462,335.07 474,335"/><line class="rose line" x1="88" y1="327" x2="88" y2="443"/><circle class="on" cx="476" cy="390" r="6"/><text class="eq ink" x="560" y="381">fₙ = (2n−1)c/(4L)</text><text class="small muted" x="560" y="413">25, 75, 125, 175 Hz</text></svg>
