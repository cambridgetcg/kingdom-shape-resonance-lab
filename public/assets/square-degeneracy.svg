<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 540" width="960" height="540"><title id="title">Square symmetry creates a degenerate eigenspace</title><desc id="desc">The square membrane modes labelled one-two and two-one share one eigenvalue. Rotating any orthonormal basis within their two-dimensional eigenspace produces another valid basis; the individual basis vectors are not canonical.</desc><style>
    .bg{fill:#0e1017}.panel{fill:#171b26;stroke:#465168;stroke-width:1.5}.ink{fill:#f4efe3}.muted{fill:#a8b0c1}.cyan{stroke:#74d7dd;fill:none}.gold{stroke:#e6b85c;fill:none}.rose{stroke:#e68aa3;fill:none}.green{stroke:#8bd3a8;fill:none}.line{stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.5}.node{fill:#171b26;stroke:#74d7dd;stroke-width:3}.on{fill:#e6b85c;stroke:#f4efe3;stroke-width:1}.off{fill:#272d3c;stroke:#667089;stroke-width:1}.label{font:600 18px ui-monospace,SFMono-Regular,Consolas,monospace}.small{font:14px ui-monospace,SFMono-Regular,Consolas,monospace}.title{font:700 26px ui-serif,Georgia,serif}.eq{font:17px ui-monospace,SFMono-Regular,Consolas,monospace}</style><rect class="bg" width="960" height="540"/>
    <text class="title ink" x="50" y="54">Equal eigenvalue; noncanonical basis</text>
    <g transform="translate(80 125)"><rect width="220" height="220" class="panel"/><line x1="110" y1="0" x2="110" y2="220" class="cyan line"/><text class="label ink" x="110" y="260" text-anchor="middle">φ₁₂</text></g>
    <g transform="translate(370 125)"><rect width="220" height="220" class="panel"/><line x1="0" y1="110" x2="220" y2="110" class="gold line"/><text class="label ink" x="110" y="260" text-anchor="middle">φ₂₁</text></g>
    <g transform="translate(660 125)"><rect width="220" height="220" class="panel"/><line x1="0" y1="220" x2="220" y2="0" class="rose line"/><line x1="0" y1="0" x2="220" y2="220" class="green thin"/><text class="label ink" x="110" y="260" text-anchor="middle">rotated basis</text></g>
    <text class="eq ink" x="480" y="438" text-anchor="middle">λ₁₂ = λ₂₁ = 5π²/a²</text><text class="small muted" x="480" y="473" text-anchor="middle">symmetry fixes the eigenspace, not one privileged pair of arrows</text></svg>
