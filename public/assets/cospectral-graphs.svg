<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 540" width="960" height="540"><title id="title">Different connected graphs, identical Laplacian spectrum</title><desc id="desc">Two connected six-vertex graphs have different degree multisets and therefore are non-isomorphic, yet their combinatorial Laplacian characteristic polynomials and spectra are exactly equal.</desc><style>
    .bg{fill:#0e1017}.panel{fill:#171b26;stroke:#465168;stroke-width:1.5}.ink{fill:#f4efe3}.muted{fill:#a8b0c1}.cyan{stroke:#74d7dd;fill:none}.gold{stroke:#e6b85c;fill:none}.rose{stroke:#e68aa3;fill:none}.green{stroke:#8bd3a8;fill:none}.line{stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.5}.node{fill:#171b26;stroke:#74d7dd;stroke-width:3}.on{fill:#e6b85c;stroke:#f4efe3;stroke-width:1}.off{fill:#272d3c;stroke:#667089;stroke-width:1}.label{font:600 18px ui-monospace,SFMono-Regular,Consolas,monospace}.small{font:14px ui-monospace,SFMono-Regular,Consolas,monospace}.title{font:700 26px ui-serif,Georgia,serif}.eq{font:17px ui-monospace,SFMono-Regular,Consolas,monospace}</style><rect class="bg" width="960" height="540"/>
    <text class="title ink" x="50" y="54">Spectrum does not identify this graph</text><text class="label ink" x="210" y="96">A</text><text class="label ink" x="690" y="96">B</text>
    <line x1="210" y1="135" x2="100" y2="220" stroke="#74d7dd" stroke-width="3"/><line x1="210" y1="135" x2="130" y2="75" stroke="#74d7dd" stroke-width="3"/><line x1="210" y1="135" x2="320" y2="75" stroke="#74d7dd" stroke-width="3"/><line x1="210" y1="135" x2="320" y2="270" stroke="#74d7dd" stroke-width="3"/><line x1="210" y1="330" x2="320" y2="75" stroke="#74d7dd" stroke-width="3"/><line x1="210" y1="330" x2="320" y2="270" stroke="#74d7dd" stroke-width="3"/><line x1="100" y1="220" x2="130" y2="75" stroke="#74d7dd" stroke-width="3"/><circle cx="210" cy="135" r="18" fill="#171b26" stroke="#f4efe3" stroke-width="2"/><text class="small ink" x="210" y="140" text-anchor="middle">0</text><circle cx="210" cy="330" r="18" fill="#171b26" stroke="#f4efe3" stroke-width="2"/><text class="small ink" x="210" y="335" text-anchor="middle">1</text><circle cx="100" cy="220" r="18" fill="#171b26" stroke="#f4efe3" stroke-width="2"/><text class="small ink" x="100" y="225" text-anchor="middle">2</text><circle cx="130" cy="75" r="18" fill="#171b26" stroke="#f4efe3" stroke-width="2"/><text class="small ink" x="130" y="80" text-anchor="middle">3</text><circle cx="320" cy="75" r="18" fill="#171b26" stroke="#f4efe3" stroke-width="2"/><text class="small ink" x="320" y="80" text-anchor="middle">4</text><circle cx="320" cy="270" r="18" fill="#171b26" stroke="#f4efe3" stroke-width="2"/><text class="small ink" x="320" y="275" text-anchor="middle">5</text><line x1="690" y1="135" x2="580" y2="220" stroke="#e6b85c" stroke-width="3"/><line x1="690" y1="135" x2="800" y2="75" stroke="#e6b85c" stroke-width="3"/><line x1="690" y1="135" x2="800" y2="270" stroke="#e6b85c" stroke-width="3"/><line x1="690" y1="330" x2="580" y2="220" stroke="#e6b85c" stroke-width="3"/><line x1="690" y1="330" x2="800" y2="75" stroke="#e6b85c" stroke-width="3"/><line x1="690" y1="330" x2="800" y2="270" stroke="#e6b85c" stroke-width="3"/><line x1="580" y1="220" x2="610" y2="75" stroke="#e6b85c" stroke-width="3"/><circle cx="690" cy="135" r="18" fill="#171b26" stroke="#f4efe3" stroke-width="2"/><text class="small ink" x="690" y="140" text-anchor="middle">0</text><circle cx="690" cy="330" r="18" fill="#171b26" stroke="#f4efe3" stroke-width="2"/><text class="small ink" x="690" y="335" text-anchor="middle">1</text><circle cx="580" cy="220" r="18" fill="#171b26" stroke="#f4efe3" stroke-width="2"/><text class="small ink" x="580" y="225" text-anchor="middle">2</text><circle cx="610" cy="75" r="18" fill="#171b26" stroke="#f4efe3" stroke-width="2"/><text class="small ink" x="610" y="80" text-anchor="middle">3</text><circle cx="800" cy="75" r="18" fill="#171b26" stroke="#f4efe3" stroke-width="2"/><text class="small ink" x="800" y="80" text-anchor="middle">4</text><circle cx="800" cy="270" r="18" fill="#171b26" stroke="#f4efe3" stroke-width="2"/><text class="small ink" x="800" y="275" text-anchor="middle">5</text>
    <text class="small muted" x="210" y="495" text-anchor="middle">degrees 2,2,2,2,2,4</text><text class="small muted" x="690" y="495" text-anchor="middle">degrees 1,2,2,3,3,3</text>
    <text class="eq ink" x="480" y="522" text-anchor="middle">det(tI−L)=t(t−2)(t−3)²(t²−6t+4)</text></svg>
