<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 540" width="960" height="540"><title id="title">Same discrete Fourier magnitude, different phase and waveform</title><desc id="desc">A real finite PCM sequence and its cyclic time reversal have exactly equal discrete Fourier magnitudes. Their Fourier phases are negated and the sample order differs. The two WAVs are declared sonifications, not acoustic measurements.</desc><style>
    .bg{fill:#0e1017}.panel{fill:#171b26;stroke:#465168;stroke-width:1.5}.ink{fill:#f4efe3}.muted{fill:#a8b0c1}.cyan{stroke:#74d7dd;fill:none}.gold{stroke:#e6b85c;fill:none}.rose{stroke:#e68aa3;fill:none}.green{stroke:#8bd3a8;fill:none}.line{stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.5}.node{fill:#171b26;stroke:#74d7dd;stroke-width:3}.on{fill:#e6b85c;stroke:#f4efe3;stroke-width:1}.off{fill:#272d3c;stroke:#667089;stroke-width:1}.label{font:600 18px ui-monospace,SFMono-Regular,Consolas,monospace}.small{font:14px ui-monospace,SFMono-Regular,Consolas,monospace}.title{font:700 26px ui-serif,Georgia,serif}.eq{font:17px ui-monospace,SFMono-Regular,Consolas,monospace}</style><rect class="bg" width="960" height="540"/>
    <text class="title ink" x="50" y="54">Magnitude alone loses phase</text><text class="label ink" x="72" y="108">x[n]</text><polyline class="cyan line" points="80,185 120,185 130,130 140,185 210,185 220,155 230,185 330,185 340,110 350,185 470,185"/><line class="thin" stroke="#667089" x1="75" y1="185" x2="480" y2="185"/>
    <text class="label ink" x="552" y="318">x[(−n) mod N]</text><polyline class="gold line" points="940,395 900,395 890,340 880,395 810,395 800,365 790,395 690,395 680,320 670,395 550,395"/><line class="thin" stroke="#667089" x1="550" y1="395" x2="955" y2="395"/>
    <text class="eq ink" x="480" y="255" text-anchor="middle">Y[k]=conj(X[k])  ⇒  |Y[k]|=|X[k]|</text><text class="small muted" x="480" y="285" text-anchor="middle">exact for a real sequence; PCM order and phases still differ</text></svg>
