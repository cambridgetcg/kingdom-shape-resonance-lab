<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 540" width="960" height="540"><title id="title">Graph to hertz: a physical bridge is required</title><desc id="desc">A four-node path graph feeds a declared equal-mass equal-spring model. The dimensionless Laplacian spectrum becomes angular frequency only after stiffness and mass are supplied. The zero eigenvalue remains a rigid translation mode.</desc><style>
    .bg{fill:#0e1017}.panel{fill:#171b26;stroke:#465168;stroke-width:1.5}.ink{fill:#f4efe3}.muted{fill:#a8b0c1}.cyan{stroke:#74d7dd;fill:none}.gold{stroke:#e6b85c;fill:none}.rose{stroke:#e68aa3;fill:none}.green{stroke:#8bd3a8;fill:none}.line{stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.5}.node{fill:#171b26;stroke:#74d7dd;stroke-width:3}.on{fill:#e6b85c;stroke:#f4efe3;stroke-width:1}.off{fill:#272d3c;stroke:#667089;stroke-width:1}.label{font:600 18px ui-monospace,SFMono-Regular,Consolas,monospace}.small{font:14px ui-monospace,SFMono-Regular,Consolas,monospace}.title{font:700 26px ui-serif,Georgia,serif}.eq{font:17px ui-monospace,SFMono-Regular,Consolas,monospace}</style><rect class="bg" width="960" height="540"/>
    <text class="title ink" x="50" y="54">P₄ graph ≠ hertz</text><text class="small muted" x="50" y="82">Topology first; units arrive with M and K.</text>
    <rect class="panel" x="48" y="105" width="458" height="155" rx="16"/><line class="cyan line" x1="122" y1="155" x2="198" y2="155"/><line class="cyan line" x1="242" y1="155" x2="318" y2="155"/><line class="cyan line" x1="362" y1="155" x2="438" y2="155"/><circle class="node" cx="100" cy="155" r="22"/><text class="small ink" x="100" y="161" text-anchor="middle">0</text><circle class="node" cx="220" cy="155" r="22"/><text class="small ink" x="220" y="161" text-anchor="middle">1</text><circle class="node" cx="340" cy="155" r="22"/><text class="small ink" x="340" y="161" text-anchor="middle">2</text><circle class="node" cx="460" cy="155" r="22"/><text class="small ink" x="460" y="161" text-anchor="middle">3</text>
    <text class="eq ink" x="78" y="225">Lλ: 0, 2−√2, 2, 2+√2</text>
    <path class="gold line" d="M280 286 H560"/><path fill="#e6b85c" d="M560 286 l-14 -8 v16 z"/>
    <text class="eq ink" x="250" y="326">K=kL, M=mI</text><text class="eq ink" x="205" y="356">ωᵢ=√((k/m)λᵢ), fᵢ=ωᵢ/(2π)</text>
    <rect class="panel" x="590" y="105" width="322" height="390" rx="16"/><text class="label ink" x="620" y="144">physical f (Hz)</text><rect x="625" y="430" width="38" height="0" fill="#667089"/><text class="small ink" x="644" y="454" text-anchor="middle">0</text><rect x="699" y="356.914" width="38" height="73.086" fill="#e6b85c"/><text class="small ink" x="718" y="454" text-anchor="middle">1</text><rect x="773" y="294.95275000000004" width="38" height="135.04725" fill="#e6b85c"/><text class="small ink" x="792" y="454" text-anchor="middle">2</text><rect x="847" y="253.55275" width="38" height="176.44725" fill="#e6b85c"/><text class="small ink" x="866" y="454" text-anchor="middle">3</text>
    <text class="small muted" x="620" y="478">mode 0: rigid, not a tone</text></svg>
