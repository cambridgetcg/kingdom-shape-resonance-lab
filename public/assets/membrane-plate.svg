<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 540" width="960" height="540"><title id="title">Same square outline, different operator</title><desc id="desc">A membrane and a simply supported thin plate share a one-metre square outline and sinusoidal mode labels, but their operators and frequency scalings differ: the membrane uses the Laplacian and the plate uses the biharmonic operator.</desc><style>
    .bg{fill:#0e1017}.panel{fill:#171b26;stroke:#465168;stroke-width:1.5}.ink{fill:#f4efe3}.muted{fill:#a8b0c1}.cyan{stroke:#74d7dd;fill:none}.gold{stroke:#e6b85c;fill:none}.rose{stroke:#e68aa3;fill:none}.green{stroke:#8bd3a8;fill:none}.line{stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.5}.node{fill:#171b26;stroke:#74d7dd;stroke-width:3}.on{fill:#e6b85c;stroke:#f4efe3;stroke-width:1}.off{fill:#272d3c;stroke:#667089;stroke-width:1}.label{font:600 18px ui-monospace,SFMono-Regular,Consolas,monospace}.small{font:14px ui-monospace,SFMono-Regular,Consolas,monospace}.title{font:700 26px ui-serif,Georgia,serif}.eq{font:17px ui-monospace,SFMono-Regular,Consolas,monospace}</style><rect class="bg" width="960" height="540"/>
    <text class="title ink" x="50" y="54">Outline alone does not fix vibration</text>
    <text class="label ink" x="82" y="105">membrane Δ</text><rect x="70" y="125" width="250" height="250" fill="#11151f" stroke="#74d7dd" stroke-width="3"/><line x1="195" y1="125" x2="195" y2="375" stroke="#74d7dd" stroke-width="2" stroke-dasharray="7 7"/><text class="eq ink" x="58" y="412">ωₘₙ=(cπ/a)√(m²+n²)</text><text class="small muted" x="86" y="444">scales with √(m²+n²)</text>
    <text class="label ink" x="602" y="105">plate Δ²</text><rect x="590" y="125" width="250" height="250" fill="#11151f" stroke="#e6b85c" stroke-width="3"/><line x1="715" y1="125" x2="715" y2="375" stroke="#e6b85c" stroke-width="2" stroke-dasharray="7 7"/><text class="eq ink" x="543" y="412">ωₘₙ=(π²/a²)√(D/ρh)(m²+n²)</text><text class="small muted" x="610" y="444">scales with (m²+n²)</text>
    <path class="rose line" d="M400 248 H560"/><path fill="#e68aa3" d="M560 248 l-14 -8 v16 z"/><text class="small ink" x="480" y="230" text-anchor="middle">same outline</text><text class="small muted" x="480" y="278" text-anchor="middle">different physics</text></svg>
