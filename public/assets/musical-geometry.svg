<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 540" width="960" height="540"><title id="title">12-TET pitch class and a declared voice-leading metric</title><desc id="desc">The left circle represents pitch classes modulo twelve with C major highlighted. The right panel shows one minimal L1 semitone voice-leading from C major to E minor under declared octave, permutation, and register conventions. It is a Western 12-TET model, not a universal geometry of music.</desc><style>
    .bg{fill:#0e1017}.panel{fill:#171b26;stroke:#465168;stroke-width:1.5}.ink{fill:#f4efe3}.muted{fill:#a8b0c1}.cyan{stroke:#74d7dd;fill:none}.gold{stroke:#e6b85c;fill:none}.rose{stroke:#e68aa3;fill:none}.green{stroke:#8bd3a8;fill:none}.line{stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.thin{stroke-width:1.5}.node{fill:#171b26;stroke:#74d7dd;stroke-width:3}.on{fill:#e6b85c;stroke:#f4efe3;stroke-width:1}.off{fill:#272d3c;stroke:#667089;stroke-width:1}.label{font:600 18px ui-monospace,SFMono-Regular,Consolas,monospace}.small{font:14px ui-monospace,SFMono-Regular,Consolas,monospace}.title{font:700 26px ui-serif,Georgia,serif}.eq{font:17px ui-monospace,SFMono-Regular,Consolas,monospace}</style><rect class="bg" width="960" height="540"/>
    <text class="title ink" x="50" y="54">Musical geometry begins with conventions</text><circle cx="255" cy="125" r="14" class="on"/><text class="small ink" x="255" y="130" text-anchor="middle">0</text><circle cx="337.5" cy="147.106" r="9" class="off"/><text class="small ink" x="337.5" y="152.106" text-anchor="middle">1</text><circle cx="397.894" cy="207.5" r="9" class="off"/><text class="small ink" x="397.894" y="212.5" text-anchor="middle">2</text><circle cx="420" cy="290" r="9" class="off"/><text class="small ink" x="420" y="295" text-anchor="middle">3</text><circle cx="397.894" cy="372.5" r="14" class="on"/><text class="small ink" x="397.894" y="377.5" text-anchor="middle">4</text><circle cx="337.5" cy="432.894" r="9" class="off"/><text class="small ink" x="337.5" y="437.894" text-anchor="middle">5</text><circle cx="255" cy="455" r="9" class="off"/><text class="small ink" x="255" y="460" text-anchor="middle">6</text><circle cx="172.5" cy="432.894" r="14" class="on"/><text class="small ink" x="172.5" y="437.894" text-anchor="middle">7</text><circle cx="112.106" cy="372.5" r="9" class="off"/><text class="small ink" x="112.106" y="377.5" text-anchor="middle">8</text><circle cx="90" cy="290" r="9" class="off"/><text class="small ink" x="90" y="295" text-anchor="middle">9</text><circle cx="112.106" cy="207.5" r="9" class="off"/><text class="small ink" x="112.106" y="212.5" text-anchor="middle">10</text><circle cx="172.5" cy="147.106" r="9" class="off"/><text class="small ink" x="172.5" y="152.106" text-anchor="middle">11</text><text class="label ink" x="255" y="505" text-anchor="middle">C major {0,4,7} in Z₁₂</text>
    <rect class="panel" x="520" y="120" width="390" height="330" rx="16"/><text class="label ink" x="555" y="160">voice leading</text>
    <text class="eq ink" x="565" y="220">C4 (0)  →  B3 (−1)</text><text class="eq ink" x="565" y="270">E4 (4)  →  E4 (4)</text><text class="eq ink" x="565" y="320">G4 (7)  →  G4 (7)</text><path class="gold line" d="M565 355 H850"/><text class="eq ink" x="565" y="400">L1 distance = 1 st</text><text class="small muted" x="555" y="430">one metric, not a preference score</text></svg>
